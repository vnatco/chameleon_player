[package]
name = "chameleon"
version = "1.0.5"
description = "Cover-first, chameleon music player for Windows"
authors = ["Vladimer Natchkepia"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "chameleon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }

# Metadata, library, covers
lofty = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
blake3 = "1"
base64 = "0.22"

# Online cover lookup (MusicBrainz + Cover Art Archive)
ureq = { version = "3", features = ["json"] }
urlencoding = "2"

# Windows media overlay (SMTC) + media keys
souvlaki = "0.8"

# Watching library folders for changes
notify = "8"

# Plumbing
crossbeam-channel = "0.5"
parking_lot = "0.12"
log = "0.4"

# Window shaping: atomic moves, DWM corners, work area
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Registry",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Decoding and image work is unusably slow unoptimized; keep deps fast in dev.
[profile.dev.package."*"]
opt-level = 2
